version = 1

[index]
dimensions = 256
include_media = true
include_generated = false
follow_symlinks = false
max_file_bytes = 5000000
max_roots = 64
watch_debounce_seconds = 0.4
watch_poll_interval_seconds = 1.0
watch_poll_max_interval_seconds = 10.0
watch_reconcile_interval_seconds = 30.0

[embedding]
backend = "native"
model = "google/embeddinggemma-2"
batch_size = 0
device = "auto"
normalize = true
ollama_host = "http://127.0.0.1:11434"
ollama_model = "embeddinggemma"
api_provider = "openai"
api_timeout = 30.0
api_retries = 2
api_batch_size = 64
max_tokens = 2048

[semantic_edges]
enabled = true
top_k = 12
mutual_preferred = true
max_degree = 8
minimum_similarity = "auto"
auto_floor = 0.55

[graph]
community_algorithm = "leiden"
compute_structural_communities = true
compute_hybrid_communities = true
community_resolution = 1.0
compute_betweenness = false
betweenness_sample = 5000
pagerank_damping = 0.85

[retrieval]
semantic_candidates = 40
lexical_candidates = 40
graph_hops = 2
max_graph_candidates = 150
default_context_tokens = 6000
max_expansion_fanout = 25

[retrieval.weights]
semantic = 1.0
lexical = 0.8
exact_name = 1.6
exact_path = 1.4
graph_proximity = 0.35
graph_expansion = 0.6
centrality = 0.2
kind_prior = 0.15
community_affinity = 0.1
recency = 0.05

[retrieval.kind_priors]
function = 1.0
method = 1.0
class = 0.95
interface = 0.95
file = 0.8
module = 0.75
test = 0.6
section = 0.6
document = 0.55
variable = 0.35
field = 0.3
directory = 0.3

[ui]
host = "127.0.0.1"
port = 7432
open_browser = true
global_graph_node_cap = 3000
global_graph_edge_cap = 12000
neighborhood_fanout = 60

[privacy]
allow_model_downloads = true
allow_remote_embedding = false
allow_remote_decisions = false
telemetry = false

[decisions]
provider = "disabled"
timeout = 3.0
confidence_threshold = 0.9
remote_providers = []
max_state_tokens = 0
