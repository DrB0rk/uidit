<body>
<main id="join" class="join hidden"><h1>Join this UIDIT review</h1><p id="join-project" class="meta"></p><form id="join-form"><label>Your name<input id="name" maxlength="80" required autocomplete="name" placeholder="Name"></label><button class="btn primary">Join review</button></form><p id="join-error" role="alert"></p></main>
<main id="app" class="shell hidden"><section class="workspace"><header class="topbar"><div class="brand">uidit <small>TEAM REVIEW</small></div><div id="connection" class="connection">Connecting…</div></header><div class="canvas-wrap"><div id="canvas" class="canvas"><div class="empty-canvas">Waiting for the project owner to share a page snapshot.</div></div></div></section><aside class="side"><header class="side-head"><div id="project" class="project">UIDIT review</div><span id="snapshot-url" class="url">Static snapshot</span><nav class="tabs" aria-label="Workspace sections"><button class="tab" data-tab="review" aria-selected="true">Review</button><button class="tab" data-tab="design" aria-selected="false">Design</button><button class="tab" data-tab="runtime" aria-selected="false">Runtime</button><button class="tab" data-tab="project" aria-selected="false">Project</button></nav></header><div id="panel" class="panel"></div></aside></main><div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
<script>
const roomId=location.pathname.split('/').filter(Boolean).at(-1),storageKey=`uidit-room:${roomId}`,inviteToken=location.hash.slice(1);let credentials,room,socket,self,retry=0,timer,pageView,tab='review',subtab='feedback',inspect=false,selected,draftPoint,viewport='desktop',style={scale:1,filter:'none',radius:0},undo=[];
const $=id=>document.getElementById(id),hide=e=>e.classList.add('hidden'),show=e=>e.classList.remove('hidden'),str=v=>String(v??'');
function toast(t){const e=$('toast');e.textContent=t;show(e);clearTimeout(e.timer);e.timer=setTimeout(()=>hide(e),2500)}function fmt(d){try{return new Date(d).toLocaleString()}catch{return ''}}function send(v){if(socket?.readyState===WebSocket.OPEN)socket.send(JSON.stringify(v));else toast('Reconnecting to the review…')}
function join(){let saved;try{saved=JSON.parse(localStorage.getItem(storageKey)||'null')}catch{}if(saved){credentials=saved;connect();return}show($('join'));if(!inviteToken){$('join-error').textContent='This invite link is missing its access key.';return}history.replaceState(null,'',location.pathname);$('join-form').addEventListener('submit',async e=>{e.preventDefault();try{const r=await fetch(`/api/rooms/${roomId}/join`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({inviteToken,name:$('name').value.trim()})}),data=await r.json();if(!r.ok)throw Error(data.error||'Unable to join');credentials=data;localStorage.setItem(storageKey,JSON.stringify(data));connect()}catch(x){$('join-error').textContent=x.message}})}
function connect(){if(!credentials||socket&&[0,1].includes(socket.readyState))return;clearTimeout(timer);show($('app'));hide($('join'));const ws=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}/api/rooms/${roomId}/socket`);socket=ws;ws.onopen=()=>ws.send(JSON.stringify({type:'auth',token:credentials.memberToken}));ws.onclose=()=>{if(socket!==ws)return;$('connection').textContent='Offline · reconnecting';timer=setTimeout(connect,Math.min(30000,1000*2**Math.min(retry++,5)))};ws.onerror=()=>ws.close();ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}if(['connected','snapshot','presence'].includes(m.type)){room=m.room;self=m.self||self;retry=0;$('connection').textContent='Live';render()}}}
function selector(el){if(el.id)return `#${CSS.escape(el.id)}`;const p=[];for(let n=el;n?.nodeType===1&&n!==n.ownerDocument.body&&p.length<5;n=n.parentElement){const same=[...n.parentElement.children].filter(x=>x.tagName===n.tagName);p.unshift(`${n.tagName.toLowerCase()}:nth-of-type(${same.indexOf(n)+1})`)}return p.join(' > ')||el.tagName.toLowerCase()}
function clearSelection(){selected=null;draftPoint=null;renderPanel()}
function wire(frame){const doc=frame.contentDocument;if(!doc||doc.documentElement.dataset.uiditWired)return;doc.documentElement.dataset.uiditWired='1';const css=doc.createElement('style');css.textContent='.uidit-team-selected{outline:3px solid #a99bff!important;outline-offset:2px!important;cursor:crosshair!important}';doc.head?.append(css);doc.addEventListener('click',e=>{if(!inspect)return;const target=e.target?.nodeType===1?e.target:e.target?.parentElement;if(!target||['HTML','BODY','HEAD','STYLE','SCRIPT'].includes(target.tagName))return;e.preventDefault();e.stopImmediatePropagation();selected?.node?.classList.remove('uidit-team-selected');target.classList.add('uidit-team-selected');const r=target.getBoundingClientRect(),root=doc.documentElement;selected={node:target,selector:selector(target),tag:target.tagName.toLowerCase(),text:str(target.textContent).replace(/\\s+/g,' ').trim().slice(0,120)};draftPoint={x:Math.max(0,Math.min(1,(r.left+r.width/2)/Math.max(root.clientWidth,1))),y:Math.max(0,Math.min(1,(r.top+r.height/2)/Math.max(root.scrollHeight,1)))};renderPanel()},{capture:true})}
async function canvas(){const view=room?.pageView,box=$('canvas');$('snapshot-url').textContent=view?.url||'Static snapshot';if(!view?.capturedAt){box.replaceChildren(Object.assign(document.createElement('div'),{className:'empty-canvas',textContent:'Waiting for the project owner to share a page snapshot.'}));return}try{if(!pageView||pageView.capturedAt!==view.capturedAt){const r=await fetch(`/api/rooms/${roomId}/page-view`,{headers:{authorization:`Bearer ${credentials.memberToken}`}}),data=await r.json();if(!r.ok)throw Error(data.error||'Could not load page snapshot');pageView={...view,...data}}if(room?.pageView?.capturedAt!==view.capturedAt)return;let media;if(pageView.html){media=document.createElement('iframe');media.title=`Static HTML snapshot of ${view.url||room.project}`;media.setAttribute('sandbox','allow-same-origin');media.srcdoc=pageView.html;media.addEventListener('load',()=>wire(media),{once:true})}else{media=document.createElement('img');media.src=pageView.dataUrl;media.alt=`Page snapshot for ${room.project}`;media.addEventListener('click',e=>{if(inspect)return;const r=box.getBoundingClientRect();draftPoint={x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height};renderPanel();pins()})}box.replaceChildren(media);pins();applyStyle()}catch(e){box.replaceChildren(Object.assign(document.createElement('div'),{className:'empty-canvas',textContent:e.message}));toast(e.message)}}
function applyStyle(){const b=$('canvas'),m=b.querySelector('iframe,img');if(!m)return;m.style.filter=style.filter;m.style.borderRadius=`${style.radius}px`;b.style.width={desktop:'min(100%,1500px)',tablet:'768px',phone:'390px'}[viewport];b.style.maxWidth='100%';b.style.transform=style.scale===1?'':`scale(${style.scale})`;b.style.transformOrigin='center'}
function pins(){const box=$('canvas');box.querySelectorAll('.pin').forEach(x=>x.remove());(room?.session?.comments||[]).filter(c=>c.point).forEach((c,i)=>{const p=btn(String(i+1),{click:()=>{tab='review';subtab='feedback';renderPanel();document.getElementById(`comment-${c.id}`)?.scrollIntoView({block:'center',behavior:'smooth'})}});p.className='pin';p.style.left=`${c.point.x*100}%`;p.style.top=`${c.point.y*100}%`;p.title=`${c.author}: ${c.text}`;box.append(p)});if(draftPoint){const p=document.createElement('span');p.className='pin draft';p.textContent='+';p.style.left=`${draftPoint.x*100}%`;p.style.top=`${draftPoint.y*100}%`;box.append(p)}}
function btn(text,o={}){const b=document.createElement('button');b.type='button';b.className=`btn${o.primary?' primary':''}${o.danger?' danger':''}${o.active?' active':''}`;b.textContent=text;b.disabled=!!o.disabled;o.click&&b.addEventListener('click',o.click);return b}
function empty(t){const e=document.createElement('div');e.className='empty';e.textContent=t;return e}
function compose(){
  const f=document.createElement('form');f.className='composer';const attachments=[];
  const t=document.createElement('textarea');t.required=true;t.maxLength=4000;t.placeholder=selected?`Comment on ${selected.selector}`:'Add page feedback for the team…';
  const previews=document.createElement('div');previews.style.cssText='display:flex;gap:6px;flex-wrap:wrap;margin-top:7px';
  const renderAttachments=()=>{previews.replaceChildren(...attachments.map((image,index)=>{const wrap=document.createElement('span');wrap.style.cssText='position:relative;display:inline-flex';const photo=document.createElement('img');photo.src=image.dataUrl;photo.alt=image.name;photo.style.cssText='width:42px;height:42px;object-fit:cover;border:1px solid var(--line);border-radius:5px';const remove=btn('×',{click:()=>{attachments.splice(index,1);renderAttachments()}});remove.setAttribute('aria-label',`Remove ${image.name}`);remove.style.cssText='position:absolute;right:-6px;top:-6px;width:17px;height:17px;padding:0;border-radius:50%;background:var(--panel);line-height:1';wrap.append(photo,remove);return wrap}))};
  const addFiles=async files=>{
    const allowed=[...files].filter(file=>file.type==='image/jpeg').slice(0,Math.max(0,2-attachments.length));
    if(!allowed.length){toast(attachments.length>=2?'A comment can include up to two photos.':'Choose a JPEG photo.');return}
    try{
      const added=await Promise.all(allowed.map(file=>new Promise((resolve,reject)=>{if(file.size>1_100_000)return reject(Error('Each photo must be 1.1 MB or smaller.'));const reader=new FileReader();reader.onerror=()=>reject(Error('Could not read photo'));reader.onload=()=>resolve({name:file.name||'Reference photo',dataUrl:reader.result});reader.readAsDataURL(file)})));
      if(attachments.reduce((total,image)=>total+image.dataUrl.length,0)+added.reduce((total,image)=>total+image.dataUrl.length,0)>1_500_000)throw Error('Attached photos must total 1.5 MB or less.');

  const input=document.createElement('input');input.type='file';input.accept='image/jpeg';input.multiple=true;input.style.display='none';input.addEventListener('change',()=>{addFiles(input.files);input.value=''});picker.append(input);
  const foot=document.createElement('div');foot.className='composer-foot';const h=document.createElement('span');h.className='hint';h.textContent=selected?`${selected.selector} · Enter to send`:draftPoint?'Feedback will be pinned to this snapshot location.':'Select an element for focused feedback.';foot.append(h,btn('Add feedback',{primary:true}));

  return f;

function feedback(c){
  const card=document.createElement('article');card.className='feedback';card.id=`comment-${c.id}`;
  card.dataset.selected=String(selected?.selector&&c.selector===selected.selector);
  const head=document.createElement('div');head.className='feedback-head';
  const loc=document.createElement('span');loc.className='location';
  loc.textContent=c.selector||room.session?.elements?.find(x=>x.id===c.elementId)?.selector||c.page||'Page feedback';
  const state=document.createElement('span');state.className=`status ${c.resolved?'resolved':''}`;state.textContent=c.resolved?'Resolved':c.status||'Open';head.append(loc,state);
  const text=document.createElement('div');text.className='feedback-text';text.textContent=c.text;
  const meta=document.createElement('div');meta.className='meta';meta.textContent=[c.author||'Reviewer',fmt(c.createdAt),c.assignee].filter(Boolean).join(' · ');
  card.append(head,text,meta);
  (c.attachments||[]).filter(image=>image.dataUrl?.startsWith('data:image/jpeg;base64,')).forEach(image=>{const photo=document.createElement('img');photo.src=image.dataUrl;photo.alt=image.name||'Comment reference photo';photo.loading='lazy';photo.style.cssText='display:block;width:100%;max-height:220px;object-fit:contain;margin-top:8px;border:1px solid var(--line);border-radius:6px;background:var(--field)';card.append(photo)});
  const thread=document.createElement('div');thread.className='thread';
  (c.replies||[]).forEach(r=>{const el=document.createElement('div');el.className='reply';const by=document.createElement('b');by.textContent=r.displayName||r.author||'Reviewer';el.append(by,document.createTextNode(r.text));thread.append(el)});
  if(!c.resolved){const f=document.createElement('form');f.className='thread-form';const i=document.createElement('input');i.required=true;i.maxLength=4000;i.placeholder='Reply';f.append(i,btn('Reply'));f.addEventListener('submit',e=>{e.preventDefault();if(i.value.trim())send({type:'comment:reply',commentId:c.id,text:i.value.trim()});i.value=''});thread.append(f)}
  if(thread.childNodes.length)card.append(thread);
  const actions=document.createElement('div');actions.className='thread-actions';
  const mine=c.source==='collaborator'&&(c.authorId===self?.memberId||(!c.authorId&&c.author===self?.name));
  const statusControl=document.createElement('select');statusControl.setAttribute('aria-label','Change feedback status');
  [['open','Open'],['in_progress','In progress'],['needs_info','Needs info']].forEach(([value,label])=>statusControl.append(new Option(label,value,false,c.status===value)));
  statusControl.addEventListener('change',()=>send({type:'comment:update',commentId:c.id,status:statusControl.value}));
  actions.append(statusControl,btn(c.resolved?'Reopen':'Resolve',{click:()=>send({type:'comment:update',commentId:c.id,resolved:!c.resolved})}));
  const assignee=document.createElement('select');assignee.setAttribute('aria-label','Assign feedback');assignee.append(new Option('Unassigned',''));
  ['Project owner',...(room?.participants||[]).map(person=>person.name).filter(name=>name!=='Project owner')].forEach(name=>assignee.append(new Option(name,name,false,c.assignee===name)));
  assignee.addEventListener('change',()=>send({type:'comment:update',commentId:c.id,assignee:assignee.value||null}));actions.append(assignee);
  if(mine){
    actions.append(btn('Edit',{click:()=>{const next=prompt('Edit feedback',c.text);if(next?.trim()&&next.trim()!==c.text)send({type:'comment:update',commentId:c.id,text:next.trim()})}}));
    actions.append(btn('Delete',{danger:true,click:()=>{if(confirm('Delete this feedback?'))send({type:'comment:delete',commentId:c.id})}}));
  }
  card.append(actions);return card;
}
function sub(items){const nav=document.createElement('nav');nav.className='subnav';items.forEach(([label,id])=>{const b=btn(label,{active:subtab===id,click:()=>{subtab=id;renderPanel()}});b.classList.add('subtab');b.setAttribute('aria-selected',String(subtab===id));nav.append(b)});return nav}
function review(){const root=document.createDocumentFragment();root.append(sub([['Feedback','feedback'],['Inspect','inspect'],['Changes','changes']]));if(subtab==='inspect'){const card=document.createElement('div');card.className='card';card.append(btn(inspect?'Inspecting · click snapshot':'Inspect element',{active:inspect,click:()=>{inspect=!inspect;if(!inspect)clearSelection();renderPanel()}}));if(selected){const code=document.createElement('code');code.className='selector';code.textContent=selected.selector;const meta=document.createElement('p');meta.className='meta';meta.textContent=selected.text||`${selected.tag} element`;card.append(code,meta,btn('Clear selection',{click:clearSelection}))}else{const p=document.createElement('p');p.className='meta';p.textContent='Turn on inspect, then click an element in the static snapshot. This selection stays in this review only.';card.append(p)}root.append(card);return root}if(subtab==='changes'){const title=document.createElement('h2');title.className='section';title.textContent='Owner changes';root.append(title);const entries=room?.session?.edits||room?.session?.proposals||[];if(entries.length){const list=document.createElement('div');list.className='list';entries.forEach(e=>{const x=document.createElement('div');x.className='card';x.textContent=typeof e==='string'?e:e.summary||e.after||e.kind||'Project change';list.append(x)});root.append(list)}else root.append(empty('No owner change summaries have been shared yet.'));return root}root.append(compose());const tools=document.createElement('div');tools.className='toolbar';const search=document.createElement('input');search.className='field';search.placeholder='Search feedback';const filter=document.createElement('select');filter.className='filter';[['all','All'],['open','Open'],['resolved','Resolved']].forEach(([v,t])=>filter.append(new Option(t,v)));tools.append(search,filter);root.append(tools);const list=document.createElement('div');list.className='list';const draw=()=>{const q=search.value.toLowerCase(),f=filter.value,all=(room?.session?.comments||[]).filter(c=>(f==='all'||(f==='resolved'?c.resolved:!c.resolved))&&`${c.text} ${c.selector||''} ${c.author||''}`.toLowerCase().includes(q));list.replaceChildren(...(all.length?all.map(feedback):[empty('No matching feedback.')]));};search.addEventListener('input',draw);filter.addEventListener('change',draw);draw();root.append(list);return root}
function design(){const root=document.createDocumentFragment();const h=document.createElement('h2');h.className='section';h.textContent='Temporary preview style';root.append(h);const c=document.createElement('div');c.className='card';const n=document.createElement('p');n.className='meta';n.textContent='These adjustments change only your browser view. They do not edit the owner’s project or shared snapshot.';c.append(n);const grid=document.createElement('div');grid.className='style-grid';[['Scale','range','scale'],['Frame radius','number','radius'],['Preview filter','select','filter']].forEach(([label,type,key])=>{const l=document.createElement('label');l.textContent=label;let input;if(type==='select'){input=document.createElement('select');[['none','None'],['grayscale(1)','Grayscale'],['contrast(1.12)','Contrast +']].forEach(([v,t])=>input.append(new Option(t,v)))}else{input=document.createElement('input');input.type=type;input.min=key==='scale'?'0.7':'0';input.max=key==='scale'?'1':'20';input.step=key==='scale'?'0.05':'1'}input.value=style[key];input.addEventListener('input',()=>{undo.push({...style});style[key]=type==='number'||type==='range'?Number(input.value):input.value;applyStyle()});l.append(input);grid.append(l)});c.append(grid,btn('Undo local style',{click:()=>{const old=undo.pop();if(old){style=old;applyStyle();renderPanel()}else toast('Nothing to undo')}}),btn('Reset',{click:()=>{undo.push({...style});style={scale:1,filter:'none',radius:0};applyStyle();renderPanel()}}));root.append(c);return root}
function runtime(){const root=document.createDocumentFragment(),h=document.createElement('h2');h.className='section';h.textContent='Viewport';root.append(h);const grid=document.createElement('div');grid.className='preset';[['desktop','Desktop'],['tablet','Tablet'],['phone','Phone']].forEach(([id,label])=>grid.append(btn(label,{active:viewport===id,click:()=>{viewport=id;applyStyle();renderPanel()}})));root.append(grid);const c=document.createElement('div');c.className='card';const v=room?.pageView;c.innerHTML='<div class="section">Snapshot</div>';const p=document.createElement('div');p.className='meta';p.textContent=v?`${v.kind==='html'?'HTML snapshot':'Image snapshot'} · ${v.width} × ${v.height} · ${fmt(v.capturedAt)}`:'No snapshot shared yet.';c.append(p);root.append(c);return root}
function project(){const root=document.createDocumentFragment();let h=document.createElement('h2');h.className='section';h.textContent='People here';root.append(h);const people=document.createElement('div');people.className='presence';(room?.participants||[]).forEach(p=>{const x=document.createElement('span');x.className=`person ${p.role==='owner'?'owner':''}`;x.textContent=p.name;people.append(x)});root.append(people.childNodes.length?people:empty('No one is connected.'));h=document.createElement('h2');h.className='section';h.textContent='Review activity';root.append(h);const act=document.createElement('div');act.className='activity';(room?.activity||[]).slice(0,30).forEach(a=>{const x=document.createElement('div');x.className='activity-item';const strong=document.createElement('strong');strong.textContent=a.name;x.append(strong,document.createTextNode(` ${a.type}${a.text?`: ${a.text}`:''}`));const time=document.createElement('time');time.textContent=fmt(a.at);x.append(time);act.append(x)});root.append(act.childNodes.length?act:empty('Activity will appear as the team works.'));return root}
function renderPanel(){const panel=$('panel');panel.replaceChildren(tab==='review'?review():tab==='design'?design():tab==='runtime'?runtime():project());document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===tab)))}function render(){if(!room)return;$('project').textContent=`${room.project} · ${(room.session?.comments||[]).filter(c=>!c.resolved).length} open`;canvas();renderPanel()}document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.tab;renderPanel()}));document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(selected){clearSelection();e.preventDefault()}else if(inspect){inspect=false;renderPanel();e.preventDefault()}}});join();
</script></body></html>
