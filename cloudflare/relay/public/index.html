<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>UIDIT team review</title>
  <style>
    :root{font:15px/1.5 Inter,ui-sans-serif,system-ui,sans-serif;color-scheme:dark;--bg:#111117;--panel:#1c1c25;--raised:#252530;--line:#353541;--text:#f3f2f8;--muted:#a6a4b4;--purple:#a99bff;--green:#7addac;--yellow:#efc977}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}.app{max-width:920px;margin:auto;padding:24px 20px 60px}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:1px solid var(--line);padding:6px 0 18px}.brand{font-weight:750;letter-spacing:.04em}.brand span{color:var(--purple)}.room-title{color:var(--muted);font-size:13px}.presence{display:flex;flex-wrap:wrap;gap:7px;margin:16px 0}.person{border:1px solid var(--line);border-radius:99px;padding:3px 10px;color:var(--muted);font-size:12px}.person.owner{color:var(--purple)}.layout{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:20px;margin-top:24px}.section-title{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:0 0 10px}.composer,.card,.join{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}.composer{margin:12px 0 16px}.composer textarea,.join input,.reply textarea{width:100%;resize:vertical;background:var(--raised);border:1px solid var(--line);border-radius:8px;padding:10px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:9px}.primary{border:0;border-radius:8px;background:var(--purple);color:#16131f;font-weight:650;padding:8px 12px}.quiet{border:1px solid var(--line);border-radius:8px;background:transparent;padding:7px 10px}.list{display:grid;gap:10px}.card{padding:13px}.card-head{display:flex;align-items:center;gap:8px;justify-content:space-between}.status{font-size:11px;color:var(--yellow);background:#413923;border-radius:99px;padding:2px 8px}.status.in_progress{color:var(--green);background:#1e3c2c}.status.needs_info{color:var(--yellow)}.location{font:12px ui-monospace,monospace;color:var(--purple);overflow-wrap:anywhere}.note{white-space:pre-wrap;margin:9px 0}.comment-photo{display:block;width:min(100%,440px);max-height:320px;object-fit:contain;margin-top:10px;border:1px solid var(--line);border-radius:8px;background:var(--raised)}.reply{padding:8px 10px;margin-top:7px;border-radius:8px;background:var(--raised);font-size:13px}.reply b{display:block;color:var(--purple);font-size:11px}.thread-actions{display:flex;gap:6px;margin-top:10px}.thread-actions select{background:var(--raised);border:1px solid var(--line);border-radius:7px;padding:5px;font-size:12px}.reply-form{display:flex;gap:7px;margin-top:9px}.reply-form input{flex:1;min-width:0;background:var(--raised);border:1px solid var(--line);border-radius:7px;padding:7px}.activity{display:grid;gap:12px}.activity-item{border-left:1px solid var(--line);padding-left:10px;color:var(--muted);font-size:12px}.activity-item time{display:block;font-size:10px;color:#777686}.empty{color:var(--muted);padding:20px;text-align:center;border:1px dashed var(--line);border-radius:10px}.join{max-width:440px;margin:13vh auto}.join h1{font-size:22px}.join form{display:grid;gap:10px}.hidden{display:none!important}.footer{margin-top:30px;color:#777686;font-size:11px;text-align:center}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);padding:8px 14px;border:1px solid var(--line);border-radius:8px;background:var(--panel);font-size:13px;display:none}.toast.visible{display:block}@media(max-width:680px){.app{padding:16px 12px 42px}.layout{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.activity{grid-template-columns:1fr 1fr}}
  </style>
  <style>
    .page-view{margin-top:20px}.page-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}.page-toolbar p{margin:0;color:var(--muted);font-size:12px}.page-canvas{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:10px;background:#09090d;line-height:0}.page-canvas img{display:block;width:100%;height:auto;object-fit:contain;cursor:crosshair}.page-canvas iframe{display:block;width:100%;height:auto;aspect-ratio:16/10;border:0;background:white}.page-canvas .pin{position:absolute;transform:translate(-50%,-50%);width:25px;height:25px;padding:0;border:2px solid white;border-radius:50%;background:var(--purple);color:#16131f;font-size:11px;font-weight:750;line-height:21px;box-shadow:0 2px 8px #0009}.page-canvas .pin:hover,.page-canvas .pin:focus-visible{z-index:2;scale:1.12}.page-canvas .pin.draft{background:var(--yellow)}.page-hint{margin:7px 0;color:var(--muted);font-size:11px}.comment-head-actions{display:flex;align-items:center;gap:7px}.delete-comment{border:0;background:transparent;color:var(--muted);padding:3px 6px;border-radius:5px;font-size:11px}.delete-comment:hover{color:#ff9292;background:#ff92921a}.composer-hint{margin:0;color:var(--muted);font-size:11px}.composer-hint button{border:0;background:transparent;color:var(--purple);padding:0;text-decoration:underline}
    @media(max-width:680px){.page-toolbar{align-items:flex-start;flex-direction:column}}
    .page-tools{display:flex;align-items:center;gap:8px}.page-tools .quiet[aria-pressed="true"]{color:var(--purple);border-color:var(--purple)}.selected-element{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0;padding:7px 10px;border:1px solid var(--line);border-radius:8px;color:var(--muted);font:12px ui-monospace,monospace}.selected-element[hidden]{display:none}
  </style>
</head>
<body>
  <main id="join" class="join hidden"><h1>Join this UIDIT review</h1><p id="join-project" class="room-title"></p><form id="join-form"><label>Your name<input id="name" maxlength="80" required autocomplete="name" placeholder="Name"></label><button class="primary">Join review</button></form><p id="join-error" role="alert"></p></main>
  <main id="app" class="app hidden"><header class="top"><div><div class="brand">UIDIT <span>TEAM REVIEW</span></div><div id="project" class="room-title"></div></div><div id="connection" class="room-title">Connecting…</div></header><div id="presence" class="presence"></div><section id="page-view" class="page-view hidden"><div class="page-toolbar"><div class="page-tools"><h2 class="section-title">Shared page</h2><button id="inspect-toggle" class="quiet" type="button" aria-pressed="false">Inspect element</button></div><p id="page-view-meta"></p></div><div id="selected-element" class="selected-element" hidden><span id="selected-element-label"></span><button id="clear-selection" class="quiet" type="button">Clear selection</button></div><div id="page-canvas" class="page-canvas" role="group" aria-label="Shared HTML snapshot; click to pin feedback"></div><p id="page-hint" class="page-hint">Inspect an element or click the snapshot to pin feedback.</p></section><div class="layout"><section><h2 class="section-title">Shared feedback</h2><form id="comment-form" class="composer"><p id="composer-hint" class="composer-hint hidden">Feedback will be pinned to the page. <button id="clear-point" type="button">Clear pin</button></p><textarea id="comment-text" rows="3" maxlength="4000" placeholder="Add page feedback for the team…" required></textarea><div class="actions"><button class="primary">Add feedback</button></div></form><div id="comments" class="list"></div></section><aside><h2 class="section-title">Activity</h2><div id="activity" class="activity"></div></aside></div><footer class="footer">UIDIT shared review · updates sync while the project owner is connected</footer></main><div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script>
    const roomId=location.pathname.split('/').filter(Boolean).at(-1), storageKey=`uidit-room:${roomId}`, inviteToken=location.hash.slice(1);let credentials=null,room=null,socket=null,self=null,retryCount=0,retryTimer=null,draftPoint=null,pageViewImage=null,pageViewLoading=null,inspectMode=false,selectedSelector=null,selectedSnapshotNode=null,selectedSnapshotOutline='';
    const $=(id)=>document.getElementById(id), show=(el)=>el.classList.remove('hidden'), esc=(value)=>String(value??'');
    const toast=(message)=>{const el=$('toast');el.textContent=message;el.classList.add('visible');setTimeout(()=>el.classList.remove('visible'),2500)};
    async function join(){const saved=JSON.parse(localStorage.getItem(storageKey)||'null');if(saved){credentials=saved;connect();return}show($('join'));if(!inviteToken){$('join-error').textContent='This invite link is missing its access key.';return}history.replaceState(null,'',location.pathname);$('join-form').addEventListener('submit',async(event)=>{event.preventDefault();try{const res=await fetch(`/api/rooms/${roomId}/join`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({inviteToken,name:$('name').value.trim()})});const data=await res.json();if(!res.ok)throw Error(data.error||'Unable to join');credentials=data;localStorage.setItem(storageKey,JSON.stringify(data));connect()}catch(error){$('join-error').textContent=error.message}})}
    function send(data){if(socket?.readyState===WebSocket.OPEN)socket.send(JSON.stringify(data));else toast('Reconnecting…')}
    function connect(){if(!credentials||socket&&[WebSocket.CONNECTING,WebSocket.OPEN].includes(socket.readyState))return;clearTimeout(retryTimer);show($('app'));$('join').classList.add('hidden');const current=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}/api/rooms/${roomId}/socket`);socket=current;current.onopen=()=>{retryCount=0;current.send(JSON.stringify({type:'auth',token:credentials.memberToken}))};current.onclose=()=>{if(socket!==current)return;socket=null;$('connection').textContent='Offline · reconnecting';const delay=Math.min(30000,1000*2**Math.min(retryCount++,5))+Math.random()*300;retryTimer=setTimeout(connect,delay)};current.onerror=()=>current.close();current.onmessage=(event)=>{let message;try{message=JSON.parse(event.data)}catch{return}if(message.type==='connected'){room=message.room;self=message.self;render();$('connection').textContent='Live'}if(message.type==='snapshot'||message.type==='presence'){room=message.room;render()}if(message.type==='cursor'){}if(message.type==='command'){} }}
    function render(){if(!room)return;$('project').textContent=`${room.project} · ${room.session?.comments?.filter((comment)=>!comment.resolved).length||0} open items`;$('presence').replaceChildren(...(room.participants||[]).map((person)=>{const el=document.createElement('span');el.className=`person ${person.role==='owner'?'owner':''}`;el.textContent=person.name;return el}));renderPageView();const comments=room.session?.comments||[];$('comments').replaceChildren(...(comments.length?comments.map((comment)=>{const card=document.createElement('article');card.className='card';card.id=`comment-${comment.id}`;const head=document.createElement('div');head.className='card-head';const location=document.createElement('span');location.className='location';const element=room.session.elements?.find((item)=>item.id===comment.elementId);location.textContent=comment.selector||element?.selector||comment.page||'Page note';const actions=document.createElement('div');actions.className='comment-head-actions';const status=document.createElement('span');status.className=`status ${comment.status||'open'}`;status.textContent=comment.resolved?'Resolved':(comment.status||'open').replace('_',' ');actions.append(status);if(comment.source==='collaborator'&&(comment.authorId===self?.memberId||(!comment.authorId&&comment.author===self?.name))){const remove=document.createElement('button');remove.type='button';remove.className='delete-comment';remove.textContent='Delete';remove.setAttribute('aria-label','Delete your comment');remove.addEventListener('click',()=>{if(window.confirm('Delete your comment and its replies?'))send({type:'comment:delete',commentId:comment.id})});actions.append(remove)}head.append(location,actions);const text=document.createElement('div');text.className='note';text.textContent=comment.text;const author=document.createElement('small');author.className='room-title';author.textContent=`${comment.author || (comment.source === 'agent' ? 'Agent' : 'Reviewer')} · ${new Date(comment.createdAt).toLocaleString()}`;card.append(head,text,author);for(const image of comment.attachments||[]){if(!image.dataUrl?.startsWith('data:image/jpeg;base64,'))continue;const photo=document.createElement('img');photo.className='comment-photo';photo.src=image.dataUrl;photo.alt=image.name||'Comment reference photo';photo.loading='lazy';card.append(photo)}for(const ref of comment.codeRefs||[]){const refEl=document.createElement('div');refEl.className='location';refEl.textContent=`${ref.file}:${ref.startLine}${ref.endLine!==ref.startLine?`–${ref.endLine}`:''}`;card.append(refEl)}for(const reply of comment.replies||[]){const replyEl=document.createElement('div');replyEl.className='reply';const by=document.createElement('b');by.textContent=reply.displayName||reply.author||'Reviewer';const value=document.createElement('span');value.textContent=reply.text;replyEl.append(by,value);card.append(replyEl)}if(!comment.resolved){const form=document.createElement('form');form.className='reply-form';const input=document.createElement('input');input.placeholder='Reply to thread';input.maxLength=4000;input.required=true;const btn=document.createElement('button');btn.className='quiet';btn.textContent='Reply';form.append(input,btn);form.addEventListener('submit',(event)=>{event.preventDefault();send({type:'comment:reply',commentId:comment.id,text:input.value});input.value='' });card.append(form)}return card}):[empty('No feedback yet. Add the first note for your team.')]))
      const activity=room.activity||[];$('activity').replaceChildren(...(activity.length?activity.slice(0,30).map((item)=>{const line=document.createElement('div');line.className='activity-item';line.textContent=`${item.name} ${item.type}${item.text?`: ${item.text}`:''}`;const time=document.createElement('time');time.textContent=new Date(item.at).toLocaleString();line.append(time);return line}):[empty('Team activity will appear here.')]))}
    const elementSelector=(element)=>{if(element.id)return `#${CSS.escape(element.id)}`;const parts=[];for(let node=element;node&&node.nodeType===1&&node!==node.ownerDocument.body&&parts.length<6;node=node.parentElement){const siblings=[...node.parentElement?.children||[]].filter((item)=>item.tagName===node.tagName);parts.unshift(`${node.tagName.toLowerCase()}:nth-of-type(${siblings.indexOf(node)+1})`)}return parts.join(' > ')||element.tagName.toLowerCase()};
    function clearSelectedElement(){if(selectedSnapshotNode){selectedSnapshotNode.classList.remove('uidit-team-inspected');selectedSnapshotNode=null}selectedSelector=null;$('selected-element').hidden=true}
    function wireInspectFrame(frame){const doc=frame.contentDocument;if(!doc||doc.documentElement.dataset.uiditInspectorWired)return;doc.documentElement.dataset.uiditInspectorWired='1';const style=doc.createElement('style');style.dataset.uiditReviewInspector='1';style.textContent='.uidit-team-inspected{outline:3px solid #a99bff!important;outline-offset:2px!important}';doc.head?.append(style);doc.addEventListener('click',(event)=>{if(!inspectMode)return;const target=event.target.nodeType===1?event.target:event.target.parentElement;if(!target||['HTML','BODY','HEAD','SCRIPT','STYLE'].includes(target.tagName))return;event.preventDefault();event.stopImmediatePropagation();if(selectedSnapshotNode)selectedSnapshotNode.classList.remove('uidit-team-inspected');selectedSnapshotNode=target;selectedSnapshotNode.classList.add('uidit-team-inspected');selectedSelector=elementSelector(target);const text=(target.textContent||'').replace(/\s+/g,' ').trim().slice(0,120);$('selected-element-label').textContent=`${selectedSelector}${text?` · ${text}`:''}`;$('selected-element').hidden=false;$('composer-hint').classList.remove('hidden');$('composer-hint').firstChild.textContent=`Feedback will reference ${selectedSelector}. `;$('comment-text').focus()},{capture:true})}
    $('inspect-toggle').addEventListener('click',()=>{inspectMode=!inspectMode;$('inspect-toggle').setAttribute('aria-pressed',String(inspectMode));$('inspect-toggle').textContent=inspectMode?'Inspecting · click an element':'Inspect element';$('page-hint').textContent=inspectMode?'Click an element in the snapshot to select it; press Escape to leave inspect mode.':'Inspect an element or click the snapshot to pin feedback.'});
    $('clear-selection').addEventListener('click',clearSelectedElement);
    document.addEventListener('keydown',(event)=>{if(event.key!=='Escape')return;if(selectedSelector){clearSelectedElement();event.preventDefault()}else if(inspectMode){inspectMode=false;$('inspect-toggle').setAttribute('aria-pressed','false');$('inspect-toggle').textContent='Inspect element';event.preventDefault()}});
    function renderPageView(){
      const view=room.pageView;if(!view?.capturedAt){$('page-view').classList.add('hidden');return}show($('page-view'));
      $('page-view-meta').textContent=`${view.kind==='html'?'HTML snapshot':'Page snapshot'} · ${view.url||'Current page'} · shared ${new Date(view.capturedAt).toLocaleString()}`;
      const canvas=$('page-canvas');
      if(pageViewImage?.capturedAt!==view.capturedAt){
        if(pageViewLoading!==view.capturedAt){
          pageViewLoading=view.capturedAt;
          fetch(`/api/rooms/${roomId}/page-view`,{headers:{authorization:`Bearer ${credentials.memberToken}`}}).then(async(response)=>{const data=await response.json();if(!response.ok)throw Error(data.error||'Could not load page view');pageViewImage={...view,...data};pageViewLoading=null;renderPageView()}).catch((error)=>{pageViewLoading=null;toast(error.message)});
        }
        return;
      }
      if(pageViewImage.html){
        if(canvas.dataset.capturedAt!==view.capturedAt){const frame=document.createElement('iframe');frame.title=`Static HTML snapshot of ${view.url||room.project}`;frame.loading='lazy';frame.setAttribute('sandbox','allow-same-origin');frame.addEventListener('load',()=>wireInspectFrame(frame),{once:true});frame.style.aspectRatio=`${view.width||16} / ${view.height||10}`;frame.srcdoc=pageViewImage.html;canvas.replaceChildren(frame);canvas.dataset.capturedAt=view.capturedAt}
        $('page-hint').textContent=inspectMode?'Click an element in the static snapshot to inspect it; press Escape to exit.':'This is a static HTML snapshot with scripts disabled. Inspect an element or click to pin feedback.';
      }else if(pageViewImage.dataUrl){
        if(canvas.dataset.capturedAt!==view.capturedAt){const image=document.createElement('img');image.src=pageViewImage.dataUrl;image.alt=`Shared page snapshot from ${view.url||room.project}`;image.draggable=false;canvas.replaceChildren(image);canvas.dataset.capturedAt=view.capturedAt}
        $('page-hint').textContent='This is a static page image. Click it to pin feedback.';
      }else{
        canvas.replaceChildren();$('page-hint').textContent='This older live preview is no longer available. Refresh the HTML snapshot from UIDIT.';
      }
      canvas.querySelectorAll('.pin').forEach((pin)=>pin.remove());
      for(const [index,comment] of (room.session?.comments||[]).filter((item)=>item.point).entries()){const pin=document.createElement('button');pin.type='button';pin.className='pin';pin.style.left=`${comment.point.x*100}%`;pin.style.top=`${comment.point.y*100}%`;pin.textContent=String(index+1);pin.title=`${comment.author}: ${comment.text}`;pin.setAttribute('aria-label',`Feedback ${index+1} by ${comment.author}: ${comment.text}`);pin.addEventListener('click',(event)=>{event.stopPropagation();document.getElementById(`comment-${comment.id}`)?.scrollIntoView({behavior:'smooth',block:'center'})});canvas.append(pin)}
      if(draftPoint){const pin=document.createElement('span');pin.className='pin draft';pin.style.left=`${draftPoint.x*100}%`;pin.style.top=`${draftPoint.y*100}%`;pin.textContent='+';canvas.append(pin)}
    }
    $('page-canvas').addEventListener('click',(event)=>{if(inspectMode||!['IMG','IFRAME'].includes(event.target.tagName))return;const rect=event.currentTarget.getBoundingClientRect();draftPoint={x:(event.clientX-rect.left)/rect.width,y:(event.clientY-rect.top)/rect.height};$('composer-hint').classList.remove('hidden');$('comment-text').focus();renderPageView()});
    $('clear-point').addEventListener('click',()=>{draftPoint=null;$('composer-hint').classList.add('hidden');renderPageView()});
    function empty(text){const el=document.createElement('div');el.className='empty';el.textContent=text;return el}
    $('comment-form').addEventListener('submit',(event)=>{event.preventDefault();const text=$('comment-text').value.trim();if(!text)return;send({type:'comment:add',text,page:room?.pageView?.url||null,point:draftPoint,selector:selectedSelector});$('comment-text').value='';draftPoint=null;$('composer-hint').classList.add('hidden');renderPageView()});
    join();
  </script>
</body>
</html>
