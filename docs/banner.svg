<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">uidit</title>
  <desc id="desc">Point uidit at a dev server, click elements in the live page, comment, and try edits. Everything lands in .uidit for your coding agent.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#15171d"/>
      <stop offset="55%" stop-color="#101219"/>
      <stop offset="100%" stop-color="#0c0d12"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a99cff"/>
      <stop offset="100%" stop-color="#6a51e8"/>
    </linearGradient>
    <linearGradient id="hairline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a99cff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a99cff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>

  <!-- ambient light: the accent only ever appears here and in 1-2 focal points -->
  <circle cx="150" cy="70" r="190" fill="#6a51e8" opacity="0.16" filter="url(#soft)"/>
  <circle cx="1090" cy="380" r="170" fill="#a99cff" opacity="0.10" filter="url(#soft)"/>

  <!-- top hairline, echoing the app's border -->
  <rect x="0" y="0" width="1200" height="2" fill="url(#hairline)"/>

  <!-- wordmark: mark + name, matching the toolbar -->
  <g transform="translate(72 62)">
    <rect x="0" y="0" width="52" height="52" rx="14" fill="url(#accent)"/>
    <!-- cursor over a target: click an element to tag it -->
    <path d="M17 13 L17 39 L24.5 31.5 L29.5 41 L35 38.5 L30 29 L40 28.5 Z"
          fill="#0c0d12" fill-opacity="0.92"/>
    <text x="70" y="34" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
          font-size="34" font-weight="650" fill="#e8eaf0">uidit</text>
    <text x="70" y="54" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
          font-size="14" fill="#8b93a3">local UI review dashboard</text>
  </g>

  <!-- headline -->
  <text x="72" y="180" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="34" font-weight="650" fill="#f2f3f7">Review UI with your agent,</text>
  <text x="72" y="222" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="34" font-weight="650" fill="#f2f3f7">without retyping feedback.</text>

  <!-- one-sentence mechanism, in plain words -->
  <text x="72" y="258" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="17" fill="#aeb5c4">Point it at a running dev server. Click elements, comment, try edits.</text>
  <text x="72" y="282" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="17" fill="#aeb5c4">Everything is written to .uidit/ so a coding agent can act on it.</text>

  <!-- install command, in a surface card rather than a code fence -->
  <g transform="translate(72 312)">
    <rect x="0" y="0" width="700" height="44" rx="10" fill="#191d24" stroke="#2a2f3a"/>
    <text x="18" y="28" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace"
          font-size="13.5" fill="#9aa1b0">$</text>
    <text x="36" y="28" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace"
          font-size="13.5" fill="#c3c8d4">curl -fsSL https://raw.githubusercontent.com/DrB0rk/uidit/HEAD/install.sh | sh</text>
  </g>

  <!-- right: the dashboard, abstracted to its real structure -->
  <g transform="translate(812 108)">
    <rect x="0" y="0" width="352" height="228" rx="12" fill="#14171d" stroke="#262b34"/>
    <!-- toolbar -->
    <rect x="0" y="0" width="352" height="34" rx="12" fill="#1b1f27"/>
    <rect x="0" y="22" width="352" height="12" fill="#1b1f27"/>
    <rect x="0" y="33" width="352" height="1" fill="#262b34"/>
    <rect x="14" y="12" width="52" height="11" rx="5" fill="url(#accent)" opacity="0.9"/>
    <rect x="78" y="12" width="96" height="11" rx="5" fill="#2a2f3a"/>
    <rect x="258" y="12" width="38" height="11" rx="5" fill="#2a2f3a"/>
    <rect x="302" y="12" width="36" height="11" rx="5" fill="#2a2f3a"/>

    <!-- preview pane with a highlighted element -->
    <rect x="12" y="46" width="204" height="170" rx="8" fill="#0e1016" stroke="#22262f"/>
    <rect x="24" y="60" width="86" height="9" rx="4" fill="#3a4150"/>
    <rect x="24" y="78" width="150" height="7" rx="3" fill="#2a2f3a"/>
    <rect x="24" y="100" width="180" height="42" rx="7" fill="#1e222b" stroke="#6a51e8" stroke-width="1.5"/>
    <rect x="36" y="114" width="70" height="7" rx="3" fill="#454c5c"/>
    <rect x="36" y="126" width="44" height="6" rx="3" fill="#343a47"/>
    <rect x="24" y="154" width="180" height="7" rx="3" fill="#2a2f3a"/>
    <rect x="24" y="170" width="120" height="7" rx="3" fill="#2a2f3a"/>
    <rect x="24" y="186" width="96" height="7" rx="3" fill="#2a2f3a"/>

    <!-- feedback panel -->
    <rect x="224" y="46" width="116" height="170" rx="8" fill="#181c24"/>
    <rect x="234" y="58" width="46" height="8" rx="4" fill="#a99cff" opacity="0.85"/>
    <rect x="286" y="58" width="44" height="8" rx="4" fill="#2a2f3a"/>
    <rect x="234" y="78" width="96" height="40" rx="6" fill="#1e222b" stroke="#2a2f3a"/>
    <rect x="242" y="88" width="66" height="6" rx="3" fill="#4a5162"/>
    <rect x="242" y="100" width="80" height="6" rx="3" fill="#343a47"/>
    <rect x="234" y="126" width="18" height="9" rx="4" fill="#6a51e8" opacity="0.9"/>
    <rect x="258" y="128" width="62" height="5" rx="2" fill="#3a4150"/>
    <rect x="234" y="148" width="96" height="34" rx="6" fill="#1b1f27" stroke="#262b34"/>
    <rect x="242" y="158" width="76" height="5" rx="2" fill="#4a5162"/>
    <rect x="242" y="169" width="58" height="5" rx="2" fill="#343a47"/>
    <rect x="234" y="190" width="96" height="16" rx="6" fill="#1b1f27" stroke="#3a4150"/>
    <rect x="241" y="195" width="34" height="6" rx="2" fill="#f2949a" opacity="0.85"/>
    <rect x="281" y="195" width="32" height="6" rx="2" fill="#5fd39b" opacity="0.9"/>
  </g>

  <!-- status chips: hue is always paired with a label, as in the app -->
  <g transform="translate(72 396)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5">
    <rect x="0" y="-14" width="132" height="24" rx="12" fill="#1b1f27" stroke="#2a2f3a"/>
    <circle cx="15" cy="-2" r="3.5" fill="#5fd39b"/>
    <text x="26" y="2" fill="#aeb5c4">no secrets</text>

    <rect x="142" y="-14" width="146" height="24" rx="12" fill="#1b1f27" stroke="#2a2f3a"/>
    <circle cx="157" cy="-2" r="3.5" fill="#5fd39b"/>
    <text x="168" y="2" fill="#aeb5c4">any dev server</text>

    <rect x="298" y="-14" width="140" height="24" rx="12" fill="#1b1f27" stroke="#2a2f3a"/>
    <circle cx="313" cy="-2" r="3.5" fill="#5fd39b"/>
    <text x="324" y="2" fill="#aeb5c4">agent-readable</text>
  </g>
</svg>