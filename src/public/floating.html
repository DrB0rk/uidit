<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UIDIT controls</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:transparent;color:#f5f3ff;font:14px system-ui,sans-serif}body{padding:4px}.wrap{display:flex;flex-direction:column;align-items:flex-end;gap:8px}.toggle{width:44px;height:44px;border:1px solid #514a70;border-radius:50%;background:#171522;color:white;font-weight:700;box-shadow:0 5px 24px #0008;cursor:pointer}.menu{display:none;width:220px;padding:8px;border:1px solid #393449;border-radius:12px;background:#171522;box-shadow:0 8px 32px #0009}.menu.open{display:grid;gap:5px}.menu button,.menu a{border:0;border-radius:7px;padding:10px;background:transparent;color:#f5f3ff;text-align:left;text-decoration:none;font:inherit;cursor:pointer}.menu button:hover,.menu a:hover{background:#28243a}.menu label{font-size:12px;color:#aaa4bd;padding:5px 8px}.menu textarea{margin:0 6px 5px;resize:vertical;min-height:60px;border-radius:6px;border:1px solid #504966;background:#100e17;color:white;padding:7px}.menu button:focus-visible,.menu a:focus-visible,.toggle:focus-visible{outline:2px solid #aa9cff;outline-offset:2px} @media(prefers-reduced-motion:no-preference){.menu{animation:pop .12s ease-out}@keyframes pop{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}}
</style><body><main class="wrap"><section class="menu" id="menu" aria-label="UIDIT actions"><button id="inspect">Inspect element</button><button id="comment">Comment on page</button><textarea id="note" aria-label="Page comment" placeholder="Add feedback…" hidden></textarea><button id="send" hidden>Post comment</button><a href="http://127.0.0.1:7717/" target="_blank" rel="noopener">Open review workspace ↗</a><label>Dev server and agent tools are available locally</label></section><button class="toggle" id="toggle" aria-label="Open UIDIT controls" aria-expanded="false" title="UIDIT">U</button></main>
<script>
const previewOrigin=(()=>{try{return new URL(document.referrer).origin}catch{return ''}})();
const send=(type,payload={})=>{if(previewOrigin)parent.postMessage({source:'uidit-control',type,...payload},previewOrigin)};
const menu=document.querySelector('#menu'),toggle=document.querySelector('#toggle');
toggle.onclick=()=>{menu.classList.toggle('open');toggle.setAttribute('aria-expanded',menu.classList.contains('open'));toggle.setAttribute('aria-label',menu.classList.contains('open')?'Close UIDIT controls':'Open UIDIT controls');send('resize',{open:menu.classList.contains('open')})};
document.querySelector('#inspect').onclick=()=>send('inspect');
document.querySelector('#comment').onclick=()=>{const n=document.querySelector('#note'),s=document.querySelector('#send');n.hidden=false;s.hidden=false;n.focus()};
document.querySelector('#send').onclick=()=>{const n=document.querySelector('#note');if(n.value.trim()){send('comment',{text:n.value.trim()});n.value='';n.hidden=true;document.querySelector('#send').hidden=true}};
addEventListener('message',e=>{if(!previewOrigin||e.origin!==previewOrigin||e.source!==parent||e.data?.source!=='uidit-preview')return;if(e.data.type==='escape'){menu.classList.remove('open');toggle.setAttribute('aria-expanded','false');send('resize',{open:false})}});
addEventListener('keydown',e=>{if(e.key==='Escape'){menu.classList.remove('open');toggle.setAttribute('aria-expanded','false');send('resize',{open:false})}});
</script></body></html>
