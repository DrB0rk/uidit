<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UIDIT review controls</title>
<style>
:root{color-scheme:light;font:13px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#f4f4f6}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}button{font:inherit;cursor:pointer}button:focus-visible{outline:2px solid #b0a4ff;outline-offset:3px}body{padding:6px}.frame{height:100%;display:flex;align-items:flex-start;flex-direction:column;justify-content:flex-end;gap:10px}.fab{position:relative;width:48px;height:48px;flex:none;border-radius:17px;border:1px solid #4d486b;background:#282638;color:#b9acff;display:grid;place-items:center;box-shadow:0 2px 8px #0003;transition:transform .18s,background .18s;cursor:grab;touch-action:none}.fab:active{cursor:grabbing}.fab:hover{background:#37324b;transform:translateY(-2px)}.fab svg{width:27px;height:27px}.badge{position:absolute;right:-6px;top:-5px;min-width:19px;height:19px;padding:0 4px;border-radius:99px;background:#b6aaff;color:#171720;border:2px solid #f8f7f2;display:grid;place-items:center;font-size:10px;font-weight:850}.badge[hidden]{display:none}
/* The controls render inside a fixed-size iframe, which clips anything wider than
   its own box, so the frame stays tight: a small shadow reads as depth, while a
   large blur would be cut off into a visible dark band around the menu. */
.menu{width:min(288px,calc(100vw - 24px));margin:0 6px;max-height:min(540px,calc(100vh - 75px));display:flex;flex-direction:column;border:1px solid #383743;border-radius:14px;background:#1d1e26;box-shadow:0 3px 12px #00000038;overflow:hidden;opacity:0;transform:translateY(7px) scale(.97);transform-origin:bottom left;pointer-events:none;transition:transform .15s,opacity .15s}.menu.open{opacity:1;transform:none;pointer-events:auto}.head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-bottom:1px solid #33323d;flex:none}.head strong{font-size:14px;letter-spacing:-.3px}.live{display:flex;gap:6px;align-items:center;color:#9fdcc0;font-size:10px;font-weight:650}.dot{width:6px;height:6px;border-radius:50%;background:#86deb7;display:inline-block;flex:none}.dot.off{background:#eaa595}.list{padding:6px;overflow-y:auto;min-height:0;scrollbar-width:thin;scrollbar-color:#4a4858 transparent}.action-section+.action-section{margin-top:3px;padding-top:6px;border-top:1px solid #302f3a}.section-label{margin:2px 8px 5px;color:#8f8e9d;font-size:9px;line-height:1.4;font-weight:750;letter-spacing:.11em;text-transform:uppercase}.row{border:0;background:transparent;color:#efeff5;display:flex;align-items:center;text-align:left;gap:10px;width:100%;min-height:38px;padding:5px 8px;border-radius:8px;text-decoration:none}.row:hover{background:#32313e}.icon{width:26px;height:26px;display:grid;place-items:center;border:1px solid #45434f;background:#2c2d36;border-radius:8px;flex:none;color:#d5d1ee;font-size:14px}.row .label{flex:1;min-width:0;font-weight:610;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row .hint{flex:none;max-width:148px;font-size:10px;color:#8f8e9d;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row .key{flex:none;font-size:10px;color:#8f8e9d}.draw-row{display:flex;gap:6px;padding:0 8px 2px}.draw-row button{flex:1;min-height:34px;display:grid;place-items:center;border:1px solid #45434f;border-radius:8px;background:#262731;color:#d5d1ee;font-size:15px}.draw-row button:hover{background:#33323e;color:#fff}.foot{padding:9px 14px;display:flex;align-items:center;gap:8px;border-top:1px solid #302f3a;background:#232430;color:#a8a7b4;font-size:10px;flex:none}.foot strong{font-weight:650;color:#e6e2f8}.spacer{flex:1}.foot button{border:0;background:none;color:#c1b6ff;font-size:10px;font-weight:650}.note{display:none;width:100%;padding:10px;background:#181921;border-top:1px solid #383844;flex:none}.note.open{display:block}.note textarea{width:100%;min-height:68px;resize:vertical;border:1px solid #4c4b5a;border-radius:8px;background:#13151c;color:#f1f1f5;padding:9px;font:12px/1.5 inherit}.note-actions{display:flex;gap:7px;justify-content:flex-end;margin-top:7px}.note-actions button{border:1px solid #4c4b5b;border-radius:7px;background:#343442;color:#efeff4;padding:7px 10px;font-size:11px}.note-actions .primary{background:#8b7de8;color:#13131b;border-color:#8b7de8;font-weight:700}body.panel-below .frame{justify-content:flex-end;flex-direction:column-reverse}body.grow-left .frame{align-items:flex-end}@media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style><style>
body.theme-light .fab{background-color:#fff!important;border-color:#d8d6e0;color:#6554c0;box-shadow:0 2px 8px #25213a20}
body.theme-light .fab:hover{background:#f3f1fa}
body.theme-light .badge{background:#7667d8;color:#fff;border-color:#fff}
body.theme-light .menu{background:#fff;border-color:#dedce5;box-shadow:0 3px 12px #25213a29;color:#252432}
body.theme-light .head,body.theme-light .foot{border-color:#ebe9f0}
body.theme-light .section-label,body.theme-light .row .hint,body.theme-light .row .key{color:#72717d}
body.theme-light .live{color:#286247}
body.theme-light .action-section+.action-section{border-color:#ebe9f0}
body.theme-light .row{color:#302f3b}
body.theme-light .row:hover{background:#f3f2f7}
body.theme-light .icon{background:#f1f0f6;border-color:#dedce5;color:#5f5b72}
body.theme-light .draw-row button{background:#f6f5fa;border-color:#dedce5;color:#5f5b72}
body.theme-light .draw-row button:hover{background:#eeecf6;color:#5645bc}
body.theme-light .foot{background:#f7f6fa;color:#666572}
body.theme-light .foot strong{color:#302f3b}
body.theme-light .foot button,body.theme-light #agentsLink{color:#6253bc!important}
body.theme-light .note{background:#faf9fc;border-color:#e8e6ed}
body.theme-light .note textarea{background:#fff;color:#302f3b;border-color:#d8d6e0}
body.theme-light .note-actions button{background:#f1f0f6;color:#302f3b;border-color:#d8d6e0}
body.theme-light .note-actions .primary{background:#7667d8;color:#fff;border-color:#7667d8}
</style></head>
<body><main class="frame"><section class="menu" id="menu" aria-label="UIDIT quick actions"><div class="head"><strong>uidit</strong><span class="live"><span class="dot" id="liveDot"></span><span id="liveText">Connected</span></span></div><div class="list">
<section class="action-section" aria-label="Review">
<button type="button" class="row" data-action="inspect" title="Pick anything on the page"><span class="icon">⌖</span><span class="label" id="inspectLabel">Inspect element</span><span class="key">I</span></button>
<button type="button" class="row" data-action="comment" title="Comment on this page or the selected element"><span class="icon">▱</span><span class="label">Leave a comment</span><span class="key">C</span></button>
<button type="button" class="row" data-action="quick-edit" title="Select an element, then click it again to edit its text"><span class="icon">✎</span><span class="label">Select text to edit</span></button>
</section>
<section class="action-section" aria-label="Draw on page"><h2 class="section-label" id="drawLabel">Draw on page</h2>
<div class="draw-row" aria-labelledby="drawLabel">
<button type="button" data-action="draw-arrow" aria-label="Draw an arrow" title="Draw an arrow: mark what should move or change">↗</button>
<button type="button" data-action="draw-rectangle" aria-label="Draw a rectangle" title="Draw a rectangle: highlight an area on the page">□</button>
<button type="button" data-action="draw-ellipse" aria-label="Draw an ellipse" title="Draw an ellipse: circle a component or area">◯</button>
<button type="button" data-action="draw-freehand" aria-label="Draw freehand" title="Draw freehand: sketch a shape or direction">〰</button>
</div>
</section>
<section class="action-section" aria-label="Workspace">
<a class="row" id="workspaceLink" href="/?workspace=1" target="_top"><span class="icon">▤</span><span class="label">Open workspace</span><span class="hint" id="workspaceHint">no feedback yet</span><span class="key">G</span></a>
<button type="button" class="row" data-action="server" title="Open the development server panel"><span class="icon">⌘</span><span class="label">Development server</span><span class="hint" id="serverHint">idle</span></button>
</section>
</div><div class="note" id="note"><textarea id="noteText" maxlength="4000" placeholder="What should change?" aria-label="Page comment"></textarea><div class="note-actions"><button type="button" data-action="cancel-note">Cancel</button><button type="button" class="primary" data-action="send-note">Post comment</button></div></div><div class="foot"><span class="dot"></span><strong id="mcpStatus">MCP · local</strong><span class="spacer"></span><a id="agentsLink" href="/?workspace=1&tab=agents" target="_top" style="color:#c1b6ff;text-decoration:none">Manage →</a></div></section>
<button class="fab" id="fab" type="button" aria-label="Open UIDIT review actions" aria-expanded="false" title="UIDIT"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round"><path d="M7 8v12a8 8 0 0 0 16 0V8"/><path d="M24.5 8v5"/></svg><span class="badge" id="badge" hidden>0</span></button></main>
<script>
(()=>{const controlOrigin=location.origin;const previewOrigin=(()=>{try{const value=new URLSearchParams(location.search).get('preview')||document.referrer;const origin=new URL(value).origin;const parsed=new URL(origin);return ['127.0.0.1','localhost','[::1]'].includes(parsed.hostname)?origin:''}catch{return ''}})();const $=s=>document.querySelector(s);const menu=$('#menu'),fab=$('#fab'),note=$('#note');let inspect=false;
const send=(action,payload={})=>{if(previewOrigin)parent.postMessage({source:'uidit-control',type:'action',action,...payload},previewOrigin)};
function setTheme(theme){const light=theme==='light';document.body.dataset.theme=theme;document.body.classList.toggle('theme-light',light);fab.style.setProperty('background-color',light?'#fff':'#282638','important');fab.style.setProperty('border-color',light?'#d8d6e0':'#4d486b','important');menu.style.setProperty('background-color',light?'#fff':'#1d1e26','important')}
const resize=(open)=>parent.postMessage({source:'uidit-control',type:'resize',open},previewOrigin||'*');
let drag=null, dragged=false;
// The frame is moved by the pointer's own movement (movementX/Y), and the button
// sits at a fixed offset inside it, so the button stays under the pointer without
// this frame having to know where it is on the page.
fab.addEventListener('pointerdown',e=>{drag={id:e.pointerId,startX:e.clientX,startY:e.clientY,screenX:e.screenX,screenY:e.screenY,moved:false};dragged=false;fab.setPointerCapture(e.pointerId)});
fab.addEventListener('pointermove',e=>{
  if(!drag||drag.id!==e.pointerId)return;
  if(!drag.moved){
    if(Math.hypot(e.clientX-drag.startX,e.clientY-drag.startY)<=7)return;
    drag.moved=true;dragged=true;
    menu.classList.remove('open');fab.setAttribute('aria-expanded','false');resize(false);
  }
  // Pointer deltas, never client coordinates: the frame moves with the pointer, so
  // a client position would feed our own movement back into the next delta.
  const dx=e.movementX||(e.screenX-drag.screenX);
  const dy=e.movementY||(e.screenY-drag.screenY);
  drag.screenX=e.screenX;drag.screenY=e.screenY;
  if(dx||dy)send('dragMove',{dx,dy});
});
fab.addEventListener('pointerup',e=>{if(!drag||drag.id!==e.pointerId)return;const moved=drag.moved;drag=null;if(moved)send('dragCommit');if(dragged)setTimeout(()=>dragged=false,0)});
fab.addEventListener('pointercancel',()=>{if(drag?.moved)send('dragCancel');drag=null;dragged=false});
function toggle(){if(dragged)return;menu.classList.toggle('open');const open=menu.classList.contains('open');fab.setAttribute('aria-expanded',String(open));fab.setAttribute('aria-label',open?'Close UIDIT review actions':'Open UIDIT review actions');resize(open)}
fab.addEventListener('click',toggle);menu.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const action=b.dataset.action;if(action==='inspect'){inspect=!inspect;$('#inspectLabel').textContent=inspect?'Exit inspect mode':'Inspect element';send('inspect',{enabled:inspect})}if(action==='comment'){note.classList.add('open');$('#noteText').focus()}if(action.startsWith('draw-')){send('draw',{tool:action.slice(5)});menu.classList.remove('open');fab.setAttribute('aria-expanded','false');resize(false)}if(action==='quick-edit'){send('workspace',{tab:'inspect',quickEdit:true})}if(action==='server')send('workspace',{tab:'server'});if(action==='cancel-note'){note.classList.remove('open');$('#noteText').value=''}if(action==='send-note'){const text=$('#noteText').value.trim();if(text){send('comment',{text});$('#noteText').value='';note.classList.remove('open')}}});
function setStatus(node,text){node.textContent=text;node.title=text}
addEventListener('message',e=>{if(!previewOrigin||e.origin!==previewOrigin||e.source!==parent||e.data?.source!=='uidit-preview')return;const d=e.data;if(d.type==='escape'){menu.classList.remove('open');fab.setAttribute('aria-expanded','false');resize(false)}if(d.type==='placement'){document.body.classList.toggle('panel-below',d.y==='below');document.body.classList.toggle('grow-left',d.x==='left')}if(d.type==='theme'||d.type==='state'){if(['light','dark'].includes(d.theme))setTheme(d.theme)}if(d.type==='state'){inspect=d.mode==='inspect';$('#inspectLabel').textContent=inspect?'Exit inspect mode':'Inspect element';const count=Math.max(0,Number(d.openComments)||0);const edits=Math.max(0,Number(d.pendingEdits)||0);$('#badge').hidden=count===0;$('#badge').textContent=count>99?'99+':String(count);setStatus($('#workspaceHint'),count||edits?`${count} open · ${edits} edit${edits===1?'':'s'}`:'no feedback yet');setStatus($('#serverHint'),d.dev?.url?`${d.dev.state} · ${d.dev.url}`:`${d.dev?.state||'idle'}`);$('#liveText').textContent=d.dev?.state==='ready'||d.dev?.state==='attached'?'Connected':'Offline';$('#liveDot').classList.toggle('off',!['ready','attached'].includes(d.dev?.state));$('#mcpStatus').textContent=`MCP · ${Number(d.mcpClients)||0} agent${Number(d.mcpClients)===1?'':'s'}`}if(d.type==='selection'&&d.selector){$('#inspectLabel').textContent='Inspect element · selected'} });
addEventListener('keydown',e=>{if(e.metaKey||e.ctrlKey||e.altKey)return;const key=e.key.toLowerCase();const typing=/INPUT|TEXTAREA|SELECT/.test(e.target?.tagName??'')||e.target?.isContentEditable===true;if(key==='escape'){if(note.classList.contains('open')){note.classList.remove('open');$('#noteText').value='';return}if(typing){e.target.blur();return}menu.classList.remove('open');fab.setAttribute('aria-expanded','false');resize(false);send('shortcut',{key:'escape'});return}if(typing)return;if(key==='i'||key==='c'||key==='g')send('shortcut',{key})});resize(false);
})();
</script></body></html>
