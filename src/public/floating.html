<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UIDIT review controls</title>
<style>
:root{color-scheme:light;font:13px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#f4f4f6}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent}button{font:inherit;cursor:pointer}button:focus-visible{outline:2px solid #b0a4ff;outline-offset:3px}body{padding:5px}.frame{height:100%;display:flex;align-items:flex-start;flex-direction:column;justify-content:flex-end;gap:10px}.fab{position:relative;width:48px;height:48px;flex:none;border-radius:17px;border:1px solid #4d486b;background:#282638;color:#b9acff;display:grid;place-items:center;box-shadow:0 5px 19px #0004,0 12px 35px #0002;transition:transform .18s,background .18s;cursor:grab;touch-action:none}.fab:active{cursor:grabbing}.fab:hover{background:#37324b;transform:translateY(-2px)}.fab svg{width:27px;height:27px}.badge{position:absolute;right:-6px;top:-5px;min-width:19px;height:19px;padding:0 4px;border-radius:99px;background:#b6aaff;color:#171720;border:2px solid #f8f7f2;display:grid;place-items:center;font-size:10px;font-weight:850}.badge[hidden]{display:none}.menu{width:min(296px,calc(100vw - 20px));max-height:min(585px,calc(100vh - 75px));display:flex;flex-direction:column;border:1px solid #3c3b49;border-radius:15px;background:#1d1e26;box-shadow:0 18px 68px #0005;overflow:hidden;opacity:0;transform:translateY(7px) scale(.97);transform-origin:bottom left;pointer-events:none;transition:transform .15s,opacity .15s}.menu.open{opacity:1;transform:none;pointer-events:auto}.head{display:flex;align-items:center;justify-content:space-between;padding:15px 16px 12px;border-bottom:1px solid #353541;flex:none}.head strong{display:block;font-size:15px;letter-spacing:-.4px}.head small{display:block;color:#9999a6;font-size:11px;margin-top:2px}.live{display:flex;gap:6px;align-items:center;border-radius:16px;background:#264039;color:#a8e2c6;padding:5px 9px;font-size:10px;font-weight:660}.dot{width:6px;height:6px;border-radius:50%;background:#86deb7;display:inline-block;flex:none}.dot.off{background:#eaa595}.list{padding:6px 7px;overflow-y:auto;min-height:0;scrollbar-width:thin;scrollbar-color:#4a4858 transparent}.action-section+.action-section{margin-top:4px;padding-top:5px;border-top:1px solid #343440}.section-label{margin:0 9px 3px;color:#9999a8;font-size:9px;line-height:1.4;font-weight:750;letter-spacing:.11em;text-transform:uppercase}.row{border:0;background:transparent;color:#efeff5;display:flex;align-items:center;text-align:left;gap:11px;width:100%;min-height:45px;padding:6px 9px;border-radius:9px}.row:hover{background:#32313e}.icon{width:29px;height:29px;display:grid;place-items:center;border:1px solid #484653;background:#30313b;border-radius:9px;flex:none;color:#d5d1ee;font-size:16px}.label{display:block;font-weight:610;font-size:12px}.hint{font-size:10px;color:#9999a8;display:block;margin-top:2px}.key{margin-left:auto;font-size:10px;color:#8a899a;white-space:nowrap}.foot{padding:10px 16px;display:flex;align-items:center;gap:8px;border-top:1px solid #343540;background:#24242e;color:#b0afbb;font-size:10px;flex:none}.foot strong{font-weight:650;color:#e8e4fb}.spacer{flex:1}.foot button{border:0;background:none;color:#c1b6ff;font-size:10px;font-weight:650}.note{display:none;width:100%;padding:10px;background:#181921;border-top:1px solid #383844;flex:none}.note.open{display:block}.note textarea{width:100%;min-height:68px;resize:vertical;border:1px solid #4c4b5a;border-radius:8px;background:#13151c;color:#f1f1f5;padding:9px;font:12px/1.5 inherit}.note-actions{display:flex;gap:7px;justify-content:flex-end;margin-top:7px}.note-actions button{border:1px solid #4c4b5b;border-radius:7px;background:#343442;color:#efeff4;padding:7px 10px;font-size:11px}.note-actions .primary{background:#8b7de8;color:#13131b;border-color:#8b7de8;font-weight:700}body.top .frame,body.middle .frame{justify-content:flex-start;flex-direction:column-reverse}.menu.open{transform:none}@media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style></head>
<body><main class="frame"><section class="menu" id="menu" aria-label="UIDIT quick actions"><div class="head"><div><strong>uidit</strong><small>Review your running app</small></div><span class="live"><span class="dot" id="liveDot"></span><span id="liveText">Connected</span></span></div><div class="list">
<section class="action-section" aria-label="Review"><h2 class="section-label">Review</h2>
<button type="button" class="row" data-action="inspect"><span class="icon">⌖</span><span><span class="label" id="inspectLabel">Inspect element</span><span class="hint">Pick anything on the page</span></span><span class="key">I</span></button>
<button type="button" class="row" data-action="comment"><span class="icon">▱</span><span><span class="label">Leave a comment</span><span class="hint">On this page or selected element</span></span><span class="key">C</span></button>
<button type="button" class="row" data-action="quick-edit"><span class="icon">✎</span><span><span class="label">Quick edit</span><span class="hint">Try text and CSS changes</span></span></button>
</section>
<section class="action-section" aria-label="Draw on page"><h2 class="section-label">Draw on page</h2>
<button type="button" class="row" data-action="draw-arrow"><span class="icon">↗</span><span><span class="label">Draw an arrow</span><span class="hint">Mark what should move or change</span></span></button>
<button type="button" class="row" data-action="draw-rectangle"><span class="icon">□</span><span><span class="label">Draw a rectangle</span><span class="hint">Highlight an area on the page</span></span></button>
<button type="button" class="row" data-action="draw-ellipse"><span class="icon">◯</span><span><span class="label">Draw an ellipse</span><span class="hint">Circle a component or area</span></span></button>
<button type="button" class="row" data-action="draw-freehand"><span class="icon">〰</span><span><span class="label">Draw freehand</span><span class="hint">Sketch a shape or direction</span></span></button>
</section>
<section class="action-section" aria-label="Workspace"><h2 class="section-label">Workspace</h2>
<a class="row" id="workspaceLink" href="/?workspace=1" target="_top" style="text-decoration:none"><span class="icon">▤</span><span><span class="label">Open workspace</span><span class="hint" id="workspaceHint">Feedback, changes and server</span></span><span class="key">G</span></a>
<button type="button" class="row" data-action="server"><span class="icon">⌘</span><span><span class="label">Development server</span><span class="hint" id="serverHint">Checking status…</span></span></button>
</section>
</div><div class="note" id="note"><textarea id="noteText" maxlength="4000" placeholder="What should change?" aria-label="Page comment"></textarea><div class="note-actions"><button type="button" data-action="cancel-note">Cancel</button><button type="button" class="primary" data-action="send-note">Post comment</button></div></div><div class="foot"><span class="dot"></span><strong id="mcpStatus">MCP · local</strong><span class="spacer"></span><a id="agentsLink" href="/?workspace=1&tab=agents" target="_top" style="color:#c1b6ff;text-decoration:none">Manage →</a></div></section>
<button class="fab" id="fab" type="button" aria-label="Open UIDIT review actions" aria-expanded="false" title="UIDIT"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round"><path d="M7 8v12a8 8 0 0 0 16 0V8"/><path d="M24.5 8v5"/></svg><span class="badge" id="badge" hidden>0</span></button></main>
<script>
(()=>{const controlOrigin=location.origin;const previewOrigin=(()=>{try{const value=new URLSearchParams(location.search).get('preview')||document.referrer;const origin=new URL(value).origin;const parsed=new URL(origin);return ['127.0.0.1','localhost','[::1]'].includes(parsed.hostname)?origin:''}catch{return ''}})();const $=s=>document.querySelector(s);const menu=$('#menu'),fab=$('#fab'),note=$('#note');let inspect=false;
const send=(action,payload={})=>{if(previewOrigin)parent.postMessage({source:'uidit-control',type:'action',action,...payload},previewOrigin)};
const resize=(open)=>parent.postMessage({source:'uidit-control',type:'resize',open},previewOrigin||'*');
let drag=null, dragged=false;
fab.addEventListener('pointerdown',e=>{drag={id:e.pointerId,x:e.clientX,y:e.clientY,moved:false};dragged=false;fab.setPointerCapture(e.pointerId)});
fab.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>7){drag.moved=true;dragged=true}});
fab.addEventListener('pointerup',e=>{if(!drag||drag.id!==e.pointerId)return;if(drag.moved)send('move',{x:e.clientX,y:e.clientY});drag=null;if(dragged)setTimeout(()=>dragged=false,0)});
fab.addEventListener('pointercancel',()=>{drag=null;dragged=false});
function toggle(){if(dragged)return;menu.classList.toggle('open');const open=menu.classList.contains('open');fab.setAttribute('aria-expanded',String(open));fab.setAttribute('aria-label',open?'Close UIDIT review actions':'Open UIDIT review actions');resize(open)}
fab.addEventListener('click',toggle);menu.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const action=b.dataset.action;if(action==='inspect'){inspect=!inspect;$('#inspectLabel').textContent=inspect?'Exit inspect mode':'Inspect element';send('inspect',{enabled:inspect})}if(action==='comment'){note.classList.add('open');$('#noteText').focus()}if(action.startsWith('draw-')){send('draw',{tool:action.slice(5)});menu.classList.remove('open');fab.setAttribute('aria-expanded','false');resize(false)}if(action==='quick-edit'){send('workspace',{tab:'inspect',quickEdit:true})}if(action==='server')send('workspace',{tab:'server'});if(action==='cancel-note'){note.classList.remove('open');$('#noteText').value=''}if(action==='send-note'){const text=$('#noteText').value.trim();if(text){send('comment',{text});$('#noteText').value='';note.classList.remove('open')}}});
addEventListener('message',e=>{if(!previewOrigin||e.origin!==previewOrigin||e.source!==parent||e.data?.source!=='uidit-preview')return;const d=e.data;if(d.type==='escape'){menu.classList.remove('open');fab.setAttribute('aria-expanded','false');resize(false)}if(d.type==='placement'){document.body.classList.toggle('top',d.y==='top');document.body.classList.toggle('middle',d.y==='middle')}if(d.type==='state'){const count=Math.max(0,Number(d.openComments)||0);$('#badge').hidden=count===0;$('#badge').textContent=count>99?'99+':String(count);$('#workspaceHint').textContent=`${count} open comments · ${Number(d.pendingEdits)||0} edits`;$('#serverHint').textContent=d.dev?.url?`${d.dev.state} · ${d.dev.url}`:`${d.dev?.state||'idle'} · no server URL`;$('#liveText').textContent=d.dev?.state==='ready'||d.dev?.state==='attached'?'Connected':'Offline';$('#liveDot').classList.toggle('off',!['ready','attached'].includes(d.dev?.state));$('#mcpStatus').textContent=`MCP · ${Number(d.mcpClients)||0} agents`}if(d.type==='selection'&&d.selector){$('#inspectLabel').textContent='Inspect element · selected'} });
addEventListener('keydown',e=>{if(e.key==='Escape'){menu.classList.remove('open');fab.setAttribute('aria-expanded','false');resize(false)}});resize(false);
})();
</script></body></html>
